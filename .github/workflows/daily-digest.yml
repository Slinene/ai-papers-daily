name: Daily digest

on:
  schedule:
    # 09:00 Asia/Shanghai = 01:00 UTC. GitHub cron jitter can add ~5-15 min.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      push_empty_day:
        description: "Send a heartbeat card even if no new papers"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run agent pipeline
        env:
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL:    ${{ vars.DEEPSEEK_MODEL }}
          FEISHU_WEBHOOK:    ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET:     ${{ secrets.FEISHU_SECRET }}
          SITE_URL:          ${{ vars.SITE_URL }}
          BASE_PATH:         ${{ vars.BASE_PATH }}
          MAX_PAPERS_PER_DAY: ${{ vars.MAX_PAPERS_PER_DAY }}
          MIN_SCORE_KEEP:     ${{ vars.MIN_SCORE_KEEP }}
          MIN_SCORE_DEEP:     ${{ vars.MIN_SCORE_DEEP }}
          PDF_TEXT_MAX_CHARS: ${{ vars.PDF_TEXT_MAX_CHARS }}
          PUSH_EMPTY_DAY:     ${{ github.event.inputs.push_empty_day || '0' }}
        run: python scripts/run_all.py

      - name: Commit new papers
        run: |
          set -e
          git config user.name  "papers-agent[bot]"
          git config user.email "papers-agent@users.noreply.github.com"
          git add src/content/papers/
          if git diff --cached --quiet; then
            echo "No new papers to commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "chore(papers): add $COUNT papers for $DATE"
            git push
          fi
